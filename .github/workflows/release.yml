# Creates the GitHub Release when a release tag is pushed.
#
# Why this exists: nothing outside GitHub can create a Release here. The deploy
# key that publishes this repo speaks git only, and a Release is a REST object
# bolted onto a tag. That is deliberate -- the same property that stops the key
# making a Release is what guarantees every byte it pushes runs the local
# pre-push hook. Granting an API credential the rights to make Releases would
# hand back a path into this repository that skips that hook. So the capability
# lives HERE instead, inside a workflow run, and on no machine anywhere.
#
# THE RELEASE IS PUBLISHED UNDER A PERSON'S NAME, AND THAT COSTS ONE TOKEN.
# A Release is attributed to whoever's credential created it, and the token
# GitHub mints for a run is attributed to a bot. Showing the real publisher
# therefore needs a named token, which lives in this repository's Actions
# secrets as RELEASE_PAT and nowhere else: never on a workstation, never in a
# file, never in a clone. Three properties keep that honest, and each one is
# in the steps below rather than in this comment:
#   * It is fine-grained, scoped to THIS repository, Contents: write and the
#     mandatory Metadata: read. That is the minimum a Release needs.
#   * There is NO FALLBACK to the run's own token. A fallback would quietly
#     restore the bot as the author while the run stayed green, which is worse
#     than failing: a check that cannot fail teaches you to stop reading it.
#   * The last step reads the author BACK and refuses any value but the
#     expected one, so a swapped, expired or re-scoped token is caught by the
#     run that used it rather than by someone noticing a byline months later.
# A token expires, and an expiry announces itself at the worst possible moment.
# That date is tracked deliberately OUTSIDE this repository, because a
# scheduled workflow here would be disabled automatically after 60 days of
# inactivity -- which is exactly the quiet stretch it would exist to cover.
#
# It is game- and mod-agnostic on purpose. Nothing below names a game, a mod or
# a file; every value comes from the tag. The next mod needs no edit.
name: Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged tree
        uses: actions/checkout@v4
        with:
          # The tag OBJECT carries the facts below; a shallow checkout has the
          # commit but not the annotation.
          fetch-depth: 0

      - name: Read the release facts from the tag
        id: facts
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          # Fetch the tag OBJECT explicitly rather than trusting whatever the
          # checkout left in refs/tags/. On 2026-10-20 the first real run failed
          # here: %(contents) returned the COMMIT MESSAGE, so every fact below
          # read as missing while the tag itself carried them all. A ref that
          # points at the commit and a ref that is absent produce the identical
          # symptom, and neither is this workflow's business to care about.
          git fetch --force --no-recurse-submodules origin \
            "refs/tags/${TAG}:refs/tags/${TAG}"

          MSG="$(git for-each-ref --format='%(contents)' "refs/tags/${TAG}")"

          # An unannotated tag, or one from before this workflow existed, has no
          # facts. Stop with a readable reason instead of publishing something
          # half-formed -- a Release with the wrong asset is worse than none.
          get() { printf '%s\n' "$MSG" | sed -n "s/^$1: //p" | head -1; }
          MOD_PATH="$(get mod-path)"
          ZIP_NAME="$(get zip-name)"
          ZIP_SHA="$(get zip-sha256)"
          EPOCH="$(get source-epoch)"
          SUMMARY="$(printf '%s\n' "$MSG" | head -1)"

          for v in MOD_PATH ZIP_NAME ZIP_SHA EPOCH SUMMARY; do
            if [ -z "${!v}" ]; then
              echo "::error::tag ${TAG} carries no ${v}. This tag was not created by the publish tool, so there is nothing to build."
              # Print what was actually read, so a repeat of this failure names
              # its own cause instead of looking like a malformed tag. The tag
              # annotation is public; there is nothing to redact.
              echo "::group::what refs/tags/${TAG} actually contained"
              printf '%s\n' "$MSG"
              echo "::endgroup::"
              exit 1
            fi
          done
          [ -d "$MOD_PATH" ] || { echo "::error::mod-path '${MOD_PATH}' is not in this tree"; exit 1; }

          # OPTIONAL, AND THE DEFAULT IS THE HISTORICAL BEHAVIOUR. Every archive
          # built by the publish tool carries file entries at 0o644, with no
          # regular-file type bit -- CDS-PartsManager-1.1.1 and
          # CDS-SteamAchievements-1.0.1 were both measured that way. DWMB 1.0.0
          # was hand-assembled before the tool existed and carries 0o100644, so
          # its zip-sha256 is unreproducible here without this fact. A tag that
          # does not carry the fact gets 644 and behaves exactly as before.
          #
          # 🚨 THIS IS THE FIRST FACT THAT CHANGES THE BUILD RATHER THAN NAMING
          # ITS INPUTS, AND A TAG ANNOTATION IS FREE TEXT, so the value is
          # whitelisted to the two modes that can legitimately occur and is
          # passed to python as ARGV -- never interpolated into the heredoc.
          ZIP_MODE="$(get zip-file-mode)"
          [ -n "$ZIP_MODE" ] || ZIP_MODE=644
          case "$ZIP_MODE" in
            644|100644) ;;
            *) echo "::error::zip-file-mode '${ZIP_MODE}' is not one of 644, 100644. Refusing to build."; exit 1 ;;
          esac

          # The Release headline follows the convention the first two Releases
          # set by hand:
          #     LukasMods - <GAME> - <Mod Name> <version>
          # Every part comes from the TAG, so this names no game and no mod and
          # needs no edit for the next one. The first automated Release got this
          # wrong -- it used the annotation's first line, which is a summary and
          # not a title -- and that headline was corrected by hand afterwards.
          # An explicit `release-title:` line in the annotation wins, for a name
          # the word split would get wrong, such as an acronym run.
          TITLE="$(get release-title)"
          if [ -z "$TITLE" ]; then
            GAME="${TAG%%-*}"
            REST="${TAG#*-}"
            SLUG="${REST%-*}"
            VERSION="${REST##*-}"
            WORDS="$(printf '%s' "$SLUG" | sed -E 's/([a-z0-9])([A-Z])/\1 \2/g')"
            TITLE="LukasMods - ${GAME} - ${WORDS} ${VERSION}"
          fi
          echo "release title: ${TITLE}"

          {
            echo "tag=$TAG"
            echo "mod_path=$MOD_PATH"
            echo "zip_name=$ZIP_NAME"
            echo "zip_sha=$ZIP_SHA"
            echo "epoch=$EPOCH"
            echo "zip_mode=$ZIP_MODE"
            echo "title=$TITLE"
          } >> "$GITHUB_OUTPUT"

      - name: Rebuild the archive, byte for byte
        env:
          MOD_PATH: ${{ steps.facts.outputs.mod_path }}
          ZIP_NAME: ${{ steps.facts.outputs.zip_name }}
          EPOCH: ${{ steps.facts.outputs.epoch }}
          ZIP_MODE: ${{ steps.facts.outputs.zip_mode }}
        run: |
          set -euo pipefail
          # Same recipe as the publish tool: fixed timestamp from the tag, sorted
          # walk, directory entries included, fixed modes. Those four together are
          # what make the output reproducible rather than merely correct.
          python3 - "$MOD_PATH" "$ZIP_NAME" "$EPOCH" "$ZIP_MODE" <<'PY'
          import sys, zipfile, os, time
          root, out, epoch = sys.argv[1], sys.argv[2], int(sys.argv[3])
          # Base 8. The shell has already refused anything but 644 or 100644.
          file_mode = int(sys.argv[4], 8)
          dt = time.gmtime(epoch)[:6]
          base = os.path.dirname(root)
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames.sort(); filenames.sort()
                  rel = os.path.relpath(dirpath, base).replace(os.sep, "/") + "/"
                  di = zipfile.ZipInfo(rel, date_time=dt)
                  di.external_attr = (0o40755 << 16) | 0x10
                  z.writestr(di, b"")
                  for fn in filenames:
                      full = os.path.join(dirpath, fn)
                      zi = zipfile.ZipInfo(os.path.relpath(full, base).replace(os.sep, "/"),
                                           date_time=dt)
                      zi.compress_type = zipfile.ZIP_DEFLATED
                      zi.external_attr = file_mode << 16
                      with open(full, "rb") as f:
                          z.writestr(zi, f.read())
          PY

      - name: Prove it matches the archive that was tested
        env:
          ZIP_NAME: ${{ steps.facts.outputs.zip_name }}
          ZIP_SHA: ${{ steps.facts.outputs.zip_sha }}
          ZIP_MODE: ${{ steps.facts.outputs.zip_mode }}
        run: |
          set -euo pipefail
          GOT="$(sha256sum "$ZIP_NAME" | cut -d' ' -f1)"
          # The mode is printed BESIDE the sha, so a future failure shows at a
          # glance whether the knob was in play rather than looking like a
          # corrupted tree.
          echo "built $GOT  (file mode ${ZIP_MODE})"
          echo "want  $ZIP_SHA"
          if [ "$GOT" != "$ZIP_SHA" ]; then
            echo "::error::rebuilt archive does not match the one that was tested. Refusing to publish it."
            exit 1
          fi
          echo "match -- this is the same archive, byte for byte"

      - name: Create the Release
        env:
          # THE NAMED TOKEN, DELIBERATELY NOT github.token. A Release is
          # attributed to whoever's credential made it, and the token GitHub
          # mints for a run is attributed to a bot. This one is fine-grained,
          # scoped to this repository alone, Contents: write and nothing else,
          # and it exists only as a repository secret -- never on a machine,
          # never in a file, never in a clone.
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          TAG: ${{ steps.facts.outputs.tag }}
          TITLE: ${{ steps.facts.outputs.title }}
          ZIP_NAME: ${{ steps.facts.outputs.zip_name }}
          ZIP_SHA: ${{ steps.facts.outputs.zip_sha }}
          MOD_PATH: ${{ steps.facts.outputs.mod_path }}
        run: |
          set -euo pipefail
          # FAIL LOUDLY ON A MISSING SECRET. Unset, gh falls back to whatever
          # else is in the environment: the byline silently reverts to a bot
          # and the run still goes green. A check that cannot fail teaches you
          # to stop reading it, so this refuses instead.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RELEASE_PAT is not set on this repository, so the"
            echo "::error::Release would be authored by a bot. Refusing."
            exit 1
          fi
          # Idempotent: a re-run of an existing tag must not fail the workflow or
          # silently make a second Release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          BODY="$(mktemp)"
          # Prefer hand-written notes for this tag. They live OUTSIDE the mod
          # path on purpose: the step above rebuilds the zip from the mod tree and
          # refuses to publish unless the sha matches the tag, so a file added
          # inside that tree would make this workflow block its own release.
          NOTES=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            cat "$NOTES" >> "$BODY"
            printf '\n\n---\n\n' >> "$BODY"
          elif [ -f "$MOD_PATH/CHANGELOG.md" ]; then
            cat "$MOD_PATH/CHANGELOG.md" >> "$BODY"
            printf '\n\n---\n\n' >> "$BODY"
          fi
          printf 'Install instructions and the full guide are in the repository.\n\n' >> "$BODY"
          printf '`%s`\nsha256 `%s`\n' "$ZIP_NAME" "$ZIP_SHA" >> "$BODY"

          gh release create "$TAG" "$ZIP_NAME" \
            --title "$TITLE" \
            --notes-file "$BODY"
          echo "created $TAG"

      - name: Prove the Release exists
        env:
          # Reading back needs no special rights, so this step keeps the
          # run's own token. Least privilege: only the step that CREATES
          # needs the named one.
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.facts.outputs.tag }}
          ZIP_NAME: ${{ steps.facts.outputs.zip_name }}
          WANT_AUTHOR: ${{ vars.RELEASE_AUTHOR_LOGIN }}
        run: |
          set -euo pipefail
          # Exit 0 from the step above is not proof. Read it back, and read back
          # the asset name too -- a Release with no asset is the failure that
          # would otherwise look like success.
          gh release view "$TAG" --json tagName,assets \
            --jq '"tag=\(.tagName) assets=\(.assets | map(.name) | join(","))"' | tee /tmp/rv
          grep -q "$ZIP_NAME" /tmp/rv || { echo "::error::Release exists but the archive is not attached"; exit 1; }

          # ---- and read the AUTHOR back ------------------------------------
          # The byline is the only thing the named token buys, so it is
          # asserted rather than assumed: a swapped, expired or re-scoped
          # token is then caught by the run that used it, instead of by
          # somebody noticing the wrong name months later.
          # An unset WANT_AUTHOR is a COULD NOT LOOK and says so. It is not a
          # pass: "nothing to compare against" and "it matched" are opposite
          # answers.
          GOT_AUTHOR="$(gh release view "$TAG" --json author --jq '.author.login')"
          echo "release author: ${GOT_AUTHOR}"
          if [ -z "${WANT_AUTHOR:-}" ]; then
            echo "::warning::RELEASE_AUTHOR_LOGIN is not set, so the author was"
            echo "::warning::read (${GOT_AUTHOR}) but could not be checked."
          elif [ "$GOT_AUTHOR" != "$WANT_AUTHOR" ]; then
            echo "::error::Release is authored by ${GOT_AUTHOR}, expected ${WANT_AUTHOR}."
            echo "::error::The token used is not the one this repository intends."
            exit 1
          else
            echo "author matches ${WANT_AUTHOR}"
          fi
